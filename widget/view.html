<div class="widget widget-container chart simulateContainer full-vertical-height {{currentTheme}}">
    <div class="padding-lg mainContainer">
        <div>
            <label class="titleHeader">{{ :: 'scenarioSimulator.LABEL_SIMULATE_SCENARIO' | translate }}</label>
            <label class="subTitle">{{ :: 'scenarioSimulator.DESC_SIMULATE_SCENARIO' | translate }}</label>
        </div>
        <div class="margin-top-20">
            
            <div class="display-flex gap-5 align-items-center">
                <span class="tau muted countLabel">{{ totalItems }}
                    {{ (totalItems === 1 ? 'scenarioSimulator.LABEL_ITEM' : 'COMPONENTS.GRID.ITEMS') | translate }}
                </span>
                <button id="refresh-scenario-btn" class="list-action btn btn-sm btn-default" type="button"
                    data-ng-click="fullRefresh()" aria-hidden="false"><span class="icon icon-refresh"
                    data-ng-class="{'fa fa-spin': refreshing}"></span></button>
                <div class="align-items-center display-flex flex-grow-1 padding-right-md position-relative widget-searchBox">
                    <span class="fa fa-search muted margin-right-md padding-left-lg position-absolute"></span> 
                    <input id="scenario-search" type="text" class="form-control padding-left-45 padding-right-25 contentSearch ng-pristine ng-untouched ng-valid ng-empty"
                            placeholder="Search" aria-labelledby="search-widget" data-ng-model="config.searchText"
                            ng-model-options="{debounce:500}" data-ng-change="searchContent()" aria-invalid="false"> <span
                            ng-show="config.searchText.length>0"
                            class="icon icon-close margin-left-20negative margin-top-2 position-relative right-10 ng-hide"
                            data-ng-click="clearSearch()" role="button" tabindex="0" aria-hidden="true"></span>
                </div>
            </div>
            <div data-ng-show="loadingData">
                <cs-spinner></cs-spinner>
            </div>
            <div class="col-md-12 padding-0 parentContainer padding-right-md margin-top-md" data-ng-if="!loadingData">
               <div data-ng-if="totalItems === 0" class="text-muted font-075em text-center">{{ :: 'APP.MESSAGE.NO_RESULTS' | translate}}</div>
                <div data-ng-repeat="scenario in scenarioData track by $index" class="simulateInfoCard display-table margin-top-sm full-width">
                    <div class="display-flex padding-md descriptionContainer">
                        <div class="imageBlock">
                            <span data-ng-bind-html="scenario.icon">
                        </div>
                        <div class="padding-left-md">
                            <label class="margin-left-md">{{scenario.title}}</label>
                            <div class="padding-md font-size-13 mdEditor" ng-class="{'line-clamp': !scenario.expanded}" id="scenario-md-{{$index}}" data-ng-bind-html="scenario.descriptionHtml">
                            </div>
                            <a href="" class="view-more" ng-if="scenario.showViewMore && scenario.descriptionHtml !== ''" 
                                ng-click="scenario.expanded = !scenario.expanded; $event.preventDefault()">
                                {{ (scenario.expanded ? 'scenarioSimulator.LABEL_VIEW_LESS' : 'scenarioSimulator.LABEL_VIEW_MORE') | translate }}
                            </a>
                        </div>
                    </div>
                    <div class="display-flex-space-between padding-md">
                        <div class="chipContainer">
                            <span class="chip margin-right-sm" data-ng-if="scenario.recordTags && scenario.recordTags.length>0"
                                data-ng-repeat="tags in scenario.recordTags">
                                <span>{{tags}}</span>
                            </span>
                        </div>
                        <div>
                            <button class="btn btn-sm {{ actionPlaybooks[scenario.createdAlertsID ? 'resetScenario' : 'runScenario'].btnClass }}" type="button" data-ng-if="!scenario.running"
                                data-ng-click="triggerScenario(scenario,$index)">
                                <i class="{{ actionPlaybooks[scenario.createdAlertsID ? 'resetScenario' : 'runScenario'].icon }}"></i> <span> {{ actionPlaybooks[scenario.createdAlertsID ? 'resetScenario' : 'runScenario'].name }} </span>
                            </button>
                            <button class="btn btn-sm btn-default" type="button" data-ng-if="scenario.running" disabled="true">
                                <i class="fa fa-spinner fa-spin"></i> <span>{{ (scenario.createdAlertsID ? 'scenarioSimulator.LABEL_RESETTING' : 'scenarioSimulator.LABEL_SIMULATING' ) | translate}} </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
